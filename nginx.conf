# RustQuest — production server config
# (mounted at /etc/nginx/conf.d/default.conf; the official image's
#  /etc/nginx/nginx.conf already includes conf.d/*.conf in the http context)
#
# The three COOP/COEP/CSP headers are MANDATORY for the in-browser rustc
# sandbox: rustc.wasm is built for wasm32-wasip1-threads and needs
# SharedArrayBuffer → the page must be cross-origin-isolated. (SECURITY.md —
# GitHub Pages can't send these, which is why the Docker/Dokploy deploy is
# the sandbox-capable target.)
#
# nginx gotcha handled below: `add_header` directives are inherited from the
# server level ONLY while a location adds none of its own — every location
# that sets Cache-Control therefore re-declares the security headers.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── security headers (every response) ─────────────────────────────
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── compression ────────────────────────────────────────────────────
    # gzip_static serves the .gz twins produced in the Dockerfile
    # (zero CPU per request); live gzip covers anything not pre-compressed.
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml;

    # NOTE: `application/wasm` is in the image's mime.types (nginx ≥ 1.21.5);
    # declared here for the gzip types list only.

    # ── content-hashed build assets → cache forever ────────────────────
    # Vite names every built file with a content hash, so "immutable" is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── spike assets (175 MB) → always revalidate + its own entry ─────
    # These URLs are NOT content-hashed: a new deploy replaces the bytes in
    # place, so browsers must revalidate on every navigation (ETag/Last-
    # Modified make the revalidate a cheap 304, not a re-download).
    # (Single block: duplicate `location` prefixes would override, not merge.)
    location /spike/ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /spike/index.html;
    }

    # /spike (no slash) → canonical form
    location = /spike {
        return 301 /spike/;
    }

    # ── main app (SPA fallback) ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
